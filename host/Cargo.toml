[package]
name = "dutchman-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.11"
directories = "6"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
wasmtime = { version = "50", default-features = false, features = ["anyhow", "async", "component-model", "cranelift", "parallel-compilation", "runtime", "std", "wat"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }
solidcraft-bridge = { path = "../../dutchman-bridge/rust" }
sc-pilot = { package = "dutchman-pilot", git = "https://github.com/dutchman-cad/pilot", rev = "dbc61ed46947a467efadbd462e6c4ac99357c8d3", default-features = false, features = ["core"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
getrandom = "0.3"
rayon = "1"
url = "2"
unicode-width = "0.2"
[dev-dependencies]
tempfile = "3"
wat = "1"
[lints]
workspace = true
