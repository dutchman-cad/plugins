[workspace]
resolver = "2"
members = ["host", "plugins/pilot", "plugins/importer-common", "plugins/importer-fusion", "plugins/importer-inventor", "plugins/importer-solidworks", "plugins/importer-freecad", "plugins/hello-panel", "plugins/print"]
default-members = ["host"]
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.57.1"
[workspace.lints.rust]
unsafe_code = "deny"
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
[profile.dev]
debug = 0
incremental = false
[profile.release]
opt-level = "z"
codegen-units = 1
debug = 0
strip = true
lto = "fat"
