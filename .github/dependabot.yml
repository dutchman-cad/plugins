# Weekly updates of the GitHub Actions this repository uses, in one PR. Cargo updates are left
# out: the workspace depends on sibling checkouts (dutchman-bridge, dutchman) by path, which
# Dependabot cannot resolve.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
