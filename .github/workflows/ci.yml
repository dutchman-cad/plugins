name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every commit on main finishes its run; a newer push cancels an older one elsewhere.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  BRIDGE_REV: 45c970bf5f3a702f4aa25a643407424b3fdf268e
  DUTCHMAN_REV: 0df4d2ee9758c6eaf430720a8b5ebc1b963d313c
  PRINT_REV: a47a6bac2ebbac9905fa61838fd98f41dcae6870
  CARGO_TARGET_DIR: ${{ github.workspace }}/plugins/target
  TMPDIR: ${{ github.workspace }}/plugins/.build-tmp
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [fmt, clippy, test, components]
    defaults:
      run:
        working-directory: plugins
    steps:
      - name: Checkout plugins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: plugins
          persist-credentials: false
      - name: Checkout Bridge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dutchman-cad/bridge
          ref: ${{ env.BRIDGE_REV }}
          path: dutchman-bridge
          persist-credentials: false
      - name: Checkout Dutchman
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dutchman-cad/dutchman
          ref: ${{ env.DUTCHMAN_REV }}
          path: dutchman
          persist-credentials: false
      - name: Checkout Print
        if: matrix.check == 'components'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dutchman-cad/print
          ref: ${{ env.PRINT_REV }}
          path: print
          persist-credentials: false
      - name: Create scratch directory
        run: mkdir -p "$TMPDIR"
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: plugins -> target
          key: ${{ matrix.check }}-${{ env.BRIDGE_REV }}-${{ env.DUTCHMAN_REV }}-${{ env.PRINT_REV }}
      - name: Check formatting
        if: matrix.check == 'fmt'
        run: cargo fmt --all --check
      - name: Lint host and plugins
        if: matrix.check == 'clippy'
        run: |
          cargo clippy --locked --release --all-targets -- -D warnings
          for plugin in pilot hello-panel print importer-fusion importer-inventor importer-solidworks importer-freecad; do
            cargo clippy --locked --release --target wasm32-wasip2 -p "dutchman-$plugin-plugin" -- -D warnings
          done
          cargo clippy --locked --release --target wasm32-wasip2 -p dutchman-importer-common -- -D warnings
      - name: Test host
        if: matrix.check == 'test'
        run: cargo test --locked --release
      - name: Build components and enforce the 16 MiB cap
        if: matrix.check == 'components'
        run: ./scripts/build-plugins.sh
      - name: Build smoke test host
        if: matrix.check == 'components'
        run: cargo build --locked --release
      - name: Run offline smoke tests
        if: matrix.check == 'components'
        run: python3 tests/smoke.py
      - name: Build Print companion
        if: matrix.check == 'components'
        run: cargo build --manifest-path ../print/Cargo.toml --release --locked --bin dutchman-print
      # Every push to main and pull request publishes the built plugins (each folder with its
      # manifest and component), the host and the Print companion it was tested with, so
      # nobody needs to build them locally to try a change.
      - name: Upload built plugins
        if: matrix.check == 'components'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugins
          path: |
            plugins/examples/*/plugin.json
            plugins/examples/*/*.wasm
            ${{ env.CARGO_TARGET_DIR }}/release/dutchman-plugins
            ${{ env.CARGO_TARGET_DIR }}/release/dutchman-print
          if-no-files-found: error
          retention-days: 14
      - name: Run Print companion smoke test
        if: matrix.check == 'components'
        run: python3 tests/print_e2e.py

  binaries:
    # Reuse the platform-independent components after all existing checks pass.
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: ''
            python: python3
          - os: macos-latest
            suffix: ''
            python: python3
          - os: windows-latest
            suffix: '.exe'
            python: python
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: plugins
    steps:
      - name: Checkout plugins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: plugins
          persist-credentials: false
      - name: Checkout Bridge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dutchman-cad/bridge
          ref: ${{ env.BRIDGE_REV }}
          path: dutchman-bridge
          persist-credentials: false
      - name: Checkout Dutchman
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dutchman-cad/dutchman
          ref: ${{ env.DUTCHMAN_REV }}
          path: dutchman
          persist-credentials: false
      - name: Checkout Print
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dutchman-cad/print
          ref: ${{ env.PRINT_REV }}
          path: print
          persist-credentials: false
      - name: Create scratch directory
        run: mkdir -p .build-tmp
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: plugins -> target
          key: binaries-${{ env.BRIDGE_REV }}-${{ env.DUTCHMAN_REV }}-${{ env.PRINT_REV }}
      - name: Test host on this OS
        run: cargo test --locked --release -p dutchman-plugins --lib --bins
      - name: Build host and Print companion
        run: |
          cargo build --locked --release -p dutchman-plugins --bin dutchman-plugins
          cargo build --manifest-path ../print/Cargo.toml --locked --release --bin dutchman-print
      - name: Download built components
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugins
          path: plugins/component-artifact
      - name: Package binaries beside plugins
        env:
          EXE_SUFFIX: ${{ matrix.suffix }}
          ARCHIVE: dutchman-plugins-${{ runner.os }}-${{ runner.arch }}.tar.gz
        run: |
          mkdir -p bundle/examples
          cp -R component-artifact/examples/. bundle/examples/
          cp "target/release/dutchman-plugins${EXE_SUFFIX}" "target/release/dutchman-print${EXE_SUFFIX}" bundle/
          cp README.md LICENSE-MIT LICENSE-APACHE ATTRIBUTION.md bundle/
          # Exercise discovery from outside the package directory.
          "bundle/dutchman-plugins${EXE_SUFFIX}" list
          "bundle/dutchman-plugins${EXE_SUFFIX}" check bundle/examples/print
          # A real terminal session: farm overview, then physical prompts answered n and y.
          if [ "$RUNNER_OS" = Windows ]; then python -m pip install pywinpty==2.0.15; fi
          PACKAGE_SESSION_SCRATCH=.build-tmp ${{ matrix.python }} tests/package_session.py bundle
          # Artifact ZIPs discard executable bits; the inner tar preserves them.
          tar -czf "$ARCHIVE" -C bundle .
      - name: Upload portable package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dutchman-plugins-${{ runner.os }}-${{ runner.arch }}
          path: plugins/dutchman-plugins-${{ runner.os }}-${{ runner.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14
